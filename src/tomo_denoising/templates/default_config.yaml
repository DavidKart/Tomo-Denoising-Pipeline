# =============================================================================
#  tomo_denoising configuration
# =============================================================================
#  Edit this file, then run the pipeline steps in order:
#
#    tomo_denoising motion_correct        WarpTools create_settings + fs_motion_and_ctf
#    tomo_denoising align_tiltseries      ts_import, ts_stack, tilt axis search, ts_aretomo3
#    tomo_denoising reconstruct_tomograms ts_defocus_hand, ts_ctf, ts_reconstruct
#    tomo_denoising run_missalignment     MissAlignment-refined reconstruction
#    tomo_denoising quality_check         RESOLVE resolution estimate + report
#    tomo_denoising train_isonet          IsoNet training     (mdocs.train set)
#    tomo_denoising predict_isonet        IsoNet denoising    (mdocs.predict set)
#
#  Or run the whole thing in one go:
#
#    tomo_denoising run_pipe
#    tomo_denoising run_pipe --skip-quality
#    tomo_denoising run_pipe --skip-missalignment
#    tomo_denoising run_pipe --produce-intermediates
#
#  run_missalignment runs by default as part of run_pipe (pass
#  --skip-missalignment to disable it). Once its half maps exist (from a
#  previous run_missalignment, this run or an earlier one), IsoNet and
#  quality_check prefer them automatically over the uncorrected raw_halfMaps
#  - see the 'missalign' section below. --produce-intermediates additionally
#  reconstructs the uncorrected raw_halfMaps(_tiltSplit) alongside
#  MissAlignment's corrected ones, purely to have both on disk - quality_check
#  still only ever measures the single preferred set with RESOLVE and never
#  compares the two.
#
#  Every step reads this file. Pass a different one with  -c / --config.
#  Every step writes a summary to <processing_directory>/logs/.
# =============================================================================


# -----------------------------------------------------------------------------
#  Config version
# -----------------------------------------------------------------------------
#  The tomo_denoising version this file was written for. Every step refuses
#  to run if it differs from the installed version (tomo_denoising --version):
#  settings get added, renamed or change meaning between versions, and an old
#  file would otherwise run with silently different behaviour.
#
#  After updating the software: write a fresh template with.
# -----------------------------------------------------------------------------
config_version: "__TOMO_DENOISING_VERSION__"


# -----------------------------------------------------------------------------
#  Resuming
# -----------------------------------------------------------------------------
#  false (default): every step checks what is already finished and only redoes
#                   what is missing or was interrupted. 
#  true:            redo everything from scratch, ignoring previous results.
#
#  Individual steps also accept --force on the command line, which overrides
#  this for that one run.

overwrite: false


# -----------------------------------------------------------------------------
#  Paths
# -----------------------------------------------------------------------------
paths:

  # Directory holding the RAW movie frames (.tif / .tiff / .eer / .mrc) and
  # the gain reference. This directory is only ever READ FROM - nothing is
  # written here. The file names are taken from the SubFramePath entries of
  # the mdocs.
  # With .mrc frames, keep ONLY the movies here: WarpTools treats every *.mrc
  # in this directory as a movie - including an .mrc gain reference or
  # SerialEM's tilt-series stacks. Put those somewhere else.
  input_frames: "frames"

  # Directory where ALL processing happens and all results are written.
  # Created if it does not exist. Everything below is created inside it:
  #
  #   <processing_directory>/
  #     warp_frameseries.settings / warp_frameseries/   <- fs_motion_and_ctf
  #     tomostar/                                       <- ts_import
  #     warp_tiltseries.settings / warp_tiltseries/      <- alignment + recon
  #       <tomo>.xml            per-tomogram alignment (native ts_aretomo3)
  #       tiltstack/<tomo>/     ts_stack output
  #       reconstruction/       ts_reconstruct output, one folder per call and
  #                             pixel size (full_<px>, frames_<px>, tilts_<px>)
  #                             - the files tomograms/ and raw_halfMaps*/ link
  #                             to. Reconstructions at an earlier pixel size
  #                             stay here (never linked again) until you
  #                             remove them.
  #       tomograms/            full, non-split tomograms (always made)
  #       raw_halfMaps/         every even_/odd_ half map produced
  #       raw_halfMaps_tiltSplit/  tilt-split half maps - only made when
  #                                quality_check.enable_tilt_split is true
  #     warp_tiltseries_prealign/  <- XML backup, taken before MissAlignment
  #     missalignment/             <- MissAlignment-refined reconstructions,
  #                                   the SAME three directories as above
  #                                   (reconstruction/, tomograms/,
  #                                   raw_halfMaps/, raw_halfMaps_tiltSplit/)
  #                                   - preferred by default once populated
  #     isonet_config/    <- the IsoNet star files
  #     isonet/            <- IsoNet working directory (networks, masks, output)
  #
  # The mdoc directories and frame directory may live anywhere.
  processing_directory: "processing"


# -----------------------------------------------------------------------------
#  Conda environments
# -----------------------------------------------------------------------------
#  Name (or path) of the conda/mamba environment a program is installed in,
#  for the programs that commonly live in one of their own rather than in the
#  environment tomo_denoising itself runs in - miss-alignment and WarpTools
#  especially. When set, EVERY call to that program is run via
#
#    conda run -n <env> --no-capture-output <program> ...
#
#  using executables.conda, so the environment does not have to be activated
#  beforehand and two programs needing incompatible environments can be used
#  in the same run.
#
#  Leave empty (the default) when the matching 'executables' entry is already
#  directly runnable - e.g. an absolute path into that environment's own bin/,
#  or the program is installed in this environment too.
#
#  A path (anything containing a separator) is passed as  conda run -p <path>
#  instead of  -n <name>.
conda_env_missalign: ""
conda_env_warptools: ""
conda_env_aretomo: ""
conda_env_isonet: ""
conda_env_resolve: ""


# -----------------------------------------------------------------------------
#  Which tomograms are used for which task
# -----------------------------------------------------------------------------
#  These are DIRECTORIES holding .mdoc files.
#
#  ALL *.mdoc files found inside are used. The tomogram name is the mdoc file
#  name with the .mdoc (and a trailing .mrc/.st/.tif) stripped, so
#  "TS_01.mrc.mdoc" -> tomogram "TS_01".
# -----------------------------------------------------------------------------
mdocs:

  # Tilt series to reconstruct.
  preprocessing: "mdocs"

  # Tilt series used to TRAIN IsoNet.
  # A small representative subset (3-5 tomograms) is normally plenty.
  # If there is no knowledge about well-suited tilt-series, this directory
  # can be auto-filled by estimation of tomogram quality with RESOLVE.
  # Auto fill only applies when the directory is empty or non-existent.
  train: "mdocsTrain"

  # Tilt series to denoise in  predict_isonet.
  predict: "mdocs"


# -----------------------------------------------------------------------------
#  Flawed tilt series   (checked in align_tiltseries, before ts_import)
# -----------------------------------------------------------------------------
#  Aborted or broken acquisitions are flagged from their mdoc right at the 
#  start if:
#
#    - fewer than min_tilts tilts, or than min_tilts_fraction x the dataset's
#      median tilt count
#    - an angular range below min_span_fraction x the dataset's median range
#    - a gap between neighbouring tilts over max_gap_factor x the series' own
#      median step
#
#  The fractions compare against the dataset itself, so any tilt scheme works.
#  With fewer than 5 tilt series in the dataset only min_tilts and the gap
#  check apply.
#
#  mode:
#    "exclude" - leave flagged series out and continue. Nothing is moved or
#                deleted: ts_import reads its mdocs from
#                  <processing_directory>/mdocs_filtered/
#    "stop"    - stop before ts_import and list the flagged series, to decide
#                yourself (e.g. move their mdocs out of mdocs.preprocessing).
#    "off"     - no check.
#
#  Tilt series a later WarpTools step gives up on (AreTomo3 alignment, CTF,
#  reconstruction) are excluded the same way and listed in the same file,
#  whatever the mode - the run goes on with the rest. align_tiltseries --force
#  runs them through WarpTools again (WarpTools itself may skip the ones it
#  marked unselected until they are re-selected with its change_selection).
#
#  The check runs on every align_tiltseries. On a project that is already
#  aligned, changing these settings either stops the run with a list of
#  WarpTools files to remove (newly flagged series), or redoes the alignment
#  (series no longer flagged need importing and aligning).
# -----------------------------------------------------------------------------
tiltseries_filter:

  mode: "exclude"

  min_tilts: 10
  min_tilts_fraction: 0.5
  min_span_fraction: 0.5
  max_gap_factor: 5


# -----------------------------------------------------------------------------
#  External programs
# -----------------------------------------------------------------------------
#  Either a bare name (looked up on PATH) or an absolute path to the binary.
# -----------------------------------------------------------------------------
executables:
  aretomo:    "AreTomo3"
  isonet:     "isonet.py"
  resolve:    "/opt/Tomo-Denoising-Pipeline/bin/RESOLVE" # quality_check
  warptools:  "WarpTools"
  missalign:  "/opt/Tomo-Denoising-Pipeline/bin/miss-alignment"                # run_missalignment

  # OPTIONAL 
  header:     "header"

  # Only used if one of the conda_env_* settings above is set. 
  conda:      "/path/to/conda"

# -----------------------------------------------------------------------------
#  GPUs
# -----------------------------------------------------------------------------
#  One list, and the ONLY GPUs any program this pipeline runs can see or use:
#  every external call (WarpTools, AreTomo3 - both this pipeline's own
#  axis-search runs and native ts_aretomo3 -, RESOLVE, IsoNet,
#  miss-alignment) is launched with CUDA_VISIBLE_DEVICES set from this list.
#
#  Programs that ALSO take GPU ids as arguments are given them automatically,
#  translated into the 0..N-1 numbering they see inside such a process
#  (IsoNet --gpuID, AreTomo3 -Gpu, miss-alignment --training-devices /
#  --reconstruction-devices). Write real GPU ids here and everywhere else in
#  this file; the translation is never something to do by hand.
gpus: [0, 1]


# -----------------------------------------------------------------------------
#  Data acquisition
# -----------------------------------------------------------------------------
acquisition:

  # Unbinned pixel size of the RAW frames, in Angstrom.
  pixel_size: 1

  # Extension of the raw frames: tif, tiff, eer or mrc.
  frame_extension: "tiff"

  # Gain reference. Must be .mrc
  # (convert a .dm4 with:  dm2mrc input_ref.dm4 output_ref.mrc).
  # Leave empty if the frames are already gain corrected.
  gain: ""

  # Gain reference orientation, passed to WarpTools create_settings
  # (--gain_flip_x/--gain_flip_y/--gain_transpose).
  gain_flip_x: false
  gain_flip_y: false
  gain_transpose: false

  # Constant for the whole dataset. Passed to WarpTools fs_motion_and_ctf
  # (--c_voltage/--c_cs/--c_amplitude) for CTF estimation, once, when the
  # frame series are processed - this is what ts_ctf later refines.
  voltage: 300.0                 # kV
  spherical_aberration: 2.7      # mm
  amplitude_contrast: 0.1


# -----------------------------------------------------------------------------
#  Frame series   (WarpTools create_settings + fs_motion_and_ctf)
# -----------------------------------------------------------------------------
frameseries:

  # WarpTools' own log2 Fourier binning of the motion-corrected averages.
  # 0 = no binning, 1 = bin by 2, 2 = bin by 4, ...
  bin: 0

  # Dose PER TILT, in e-/A^2. WarpTools needs this explicitly for its own
  # dose weighting.
  exposure: 3.0

  # Only used when acquisition.frame_extension is "eer".
  eer_ngroups: ""

  m_grid: "1x1x5"  # -> SPECIFY (1x1x<NumSubFrames from the mdocs>)
  c_grid: "2x2x1"  # -> default is usually fine
  c_range_max: 7.0 # max res for CTF fit. Must be > Nyq of motion-corrected averages.
  c_defocus_max: 8.0 # max defocus to be considered
  c_use_sum: true

  # How many frame series WarpTools processes at once, per GPU.
  perdevice: 1

  # Appended verbatim to every fs_motion_and_ctf call.
  extra_args: ""


# -----------------------------------------------------------------------------
#  Tomogram dimensions   (WarpTools create_settings --tomo_dimensions)
# -----------------------------------------------------------------------------
#  Wants UNBINNED (raw camera) pixel dimensions.
# -----------------------------------------------------------------------------
tomo_dimensions:

  # "auto" -> taken from a frame-series average's own pixel shape, scaled
  # back up to unbinned. Or set explicitly, e.g. "4400x6000".
  xy: "auto"

  # Reconstruction thickness in unbinned pixels (same convention as
  # --tomo_dimensions itself).
  z: 1200


# -----------------------------------------------------------------------------
#  AreTomo   (mostly this pipeline's own external tilt-axis search)
# -----------------------------------------------------------------------------
#  WarpTools' own tilt-series alignment seem currently biased to take the .mdoc
#  reported tilt-axis in all cases, so it is solved externally instead: 
#  a few alignment-only AreTomo
#  runs (executables.aretomo, the SAME build handed to ts_aretomo3 --exe) on
#  random subsets of tilt series, combined into one dataset-wide angle. The
#  REAL per-tomogram alignment is then computed by native WarpTools
#  ts_aretomo3, axis fixed, no further search.
#
#  Everything here applies to those external calls only - EXCEPT alignz,
#  which is handed to native ts_aretomo3 as well (see there).
# -----------------------------------------------------------------------------
aretomo:

  dark_tolerance: 0.1
  wbp: true                      # weighted back projection (-Wbp 1)

  # Alignment thickness in UNBINNED pixels - the same unit as
  # tomo_dimensions.z.
  #
  # One value, fed to both consumers, each converted to the unit it wants:
  #   - WarpTools ts_aretomo3 --alignz : ANGSTROM (unbinned px x pixel size)
  #   - AreTomo3 -AlignZ (the tilt-axis iterations below) : PIXELS at the
  #     input stack's own pixel size (warptools.align_angpix)
  #
  # "" (default): neither call is given the argument at all, leaving to
  # be solved by AreTomo3 internally.
  alignz: ""

  # --- tilt axis refinement -------------------------------------------------
  # The tilt axis is refined once for the whole dataset and then held fixed.
  # Each iteration aligns a random subset of tilt series, and their tilt axis
  # angles are combined into one robust estimate (see the log).
  #
  # "" (default): iteration 1 is a free search. Set to a degrees value to
  # use it as iteration 1's starting point instead (refined within +/-3 deg,
  # same as every later iteration) - iteration 2 onward is unaffected, still
  # taking the previous iteration's result as usual.
  #
  # With tilt_axis_iterations: 0 below, this value is instead used directly
  # AS the converged tilt axis, with no external search performed at all -
  # the opposite of tilt_axis_iterations: 0 with this left empty, which
  # searches each tomogram independently via ts_aretomo3 instead.
  initial_tilt_axis: ""

  # Set to 0 to disable refinement entirely and let ts_aretomo3 search every
  # tilt series' axis independently (unless initial_tilt_axis is set above,
  # see there).
  tilt_axis_iterations: 3

  # Tilt series per refinement iteration. Datasets with fewer than this are
  # used in full, and a different random subset is drawn for each iteration.
  tilt_axis_subset_size: 10

  # Seed for those random subsets, so a resumed run picks the same ones.
  tilt_axis_seed: 0

  # Appended verbatim to every (axis-search) AreTomo call.
  extra_args: ""


# -----------------------------------------------------------------------------
#  WarpTools   (motion_correct / align_tiltseries / reconstruct_tomograms)
# -----------------------------------------------------------------------------
warptools:

  dont_invert: false             # ts_import --dont_invert
  min_intensity: 0.3             # ts_import --min_intensity

  # --- tilt ANGLE offset (ts_import) ----------------------------------------
  # This is the 0-tilt zero point - the specimen's pre-tilt
  # Both auto_zero and tilt_offset are off by default:
  # Optionally oet ONE of them, not both.

  # ts_import --auto_zero: shift every tilt angle so that the tilt with the
  # highest average intensity becomes the 0-tilt. 
  auto_zero: false

  # ts_import --tilt_offset: subtract this many degrees from every tilt angle.
  # Use when you already know the pre-tilt, e.g. a lamella milled at a fixed
  # angle. Empty (default) = no shift.
  tilt_offset: ""

  # Pixel size (A) for ts_stack, this pipeline's own axis-search AreTomo
  # calls, and native ts_aretomo3 - coarser than the final reconstruction, as
  # is normal for alignment.
  align_angpix: 2*pixel_size

  # Final reconstruction pixel size (A), for ts_reconstruct. Also what the
  # half maps' voxel size is taken to be everywhere downstream (IsoNet, ...).
  recon_angpix: 10.0

  min_fov: 0                     # ts_aretomo3 --min_fov

  # ts_defocus_hand --check always runs: a negative average correlation means
  # the handedness should be 'flip', otherwise 'no flip'. true: tilt series
  # set otherwise are corrected automatically (--set_flip / --set_noflip),
  # and the result is verified. false: they are only reported.
  auto_fix_defocus_hand: true

  ts_ctf_range_high: 7.0 # needs be > 2*align_angpix
  ts_ctf_defocus_max: 8.0 # max defocus to be considered

  # How many tilt series WarpTools reconstructs/aligns at once, per GPU.
  # Which GPUs is not set here - it comes from the top-level 'gpus' list, as
  # for every other program (passed as WarpTools' own --device_list where the
  # subcommand supports it, on top of CUDA_VISIBLE_DEVICES).
  perdevice: 1


# -----------------------------------------------------------------------------
#  MissAlignment   (tomo_denoising run_missalignment)
# -----------------------------------------------------------------------------
#  Refines each tomogram's ts_aretomo3 alignment with MissAlignment's local,
#  per-tilt deformation model (modifying warp_tiltseries/<tomo>.xml IN
#  PLACE - a backup is kept in warp_tiltseries_prealign/), then reconstructs
#  the frame-split (for IsoNet) half maps with WarpTools ts_reconstruct -
#  plus the tilt-split ones, if quality_check.enable_tilt_split asks for
#  them.
#
#  Pass --skip-missalignment to disable MissAlignment for a run and reconstruct
#  the uncorrected half maps directly instead, or set enabled: false here.
#
#  Everything lands in <processing_directory>/missalignment/, including two
#  shared half-map directories (halfMaps/, halfMaps_tiltSplit/) mirroring
#  raw_halfMaps/raw_halfMaps_tiltSplit. Once populated, IsoNet training/
#  prediction and quality_check use the MissAlignment-corrected halfMaps(_
#  tiltSplit)/ instead of raw_halfMaps(_tiltSplit)/ BY DEFAULT - this
#  preference only checks whether the half maps exist, not how/whether this
#  run itself produced them.
#
#  If it was never run (or enabled: false below) and neither half-map kind
#  exists yet, running quality_check or IsoNet directly reconstructs
#  raw_halfMaps(_tiltSplit)/ on demand from the uncorrected alignment.
# -----------------------------------------------------------------------------
missalign:

  enabled: true

  # "XxYxZ" (unbinned px, same convention as tomo_dimensions) to tighten the
  # volume MissAlignment trains against so it does not spend capacity on
  # empty margins.
  # Leave empty (default) to train against the same dimensions as the final
  # reconstruction (tomo_dimensions).
  training_volume_dimensions: ""

  # VRAM per GPU, in GB - the single setting that adapts MissAlignment to
  # the machine. Two profiles:
  #
  #   >= 24   MissAlignment's own documented reference settings, unchanged:
  #           batch size 32 for both the training and the reconstruction
  #           pool, and 3 reconstruction processes per GPU.
  #
  #   < 24    Low-memory profile, down to 12 GB (anything lower is treated
  #           as 12 and warned about). Three things shrink together, 
  #           data_loading.batch_size, tilt_series_alignment.batch_size, 
  #           how many reconstruction PROCESSES share one GPU.
  #           Also fewer dataloaders per trainer, which each drive
  #           reconstruction work. What is NOT reduced: patch_size (96). 
  #
  #           Expect the smaller training batch to make the contrastive
  #           training a little noisier, i.e. a somewhat weaker correction
  #           than a 24 GB card would give - not a different kind of result.
  #
  gpu_memory_gb: 12

  # Overrides for everything the gpu_memory_gb profile decides. Leave null
  # (the default) to use the profile. 
  batch_size: null                        # data_loading.batch_size
  alignment_batch_size: null              # tilt_series_alignment.batch_size
  reconstruction_processes_per_gpu: null
  training_devices: null
  reconstruction_devices: null
  dataloaders_per_trainer: null

  # miss-alignment train's --prepare-stacks, in GB of scratch space.
  prepare_stacks_gb: 10.0

  # NCCL transport control for multi-GPU training (ignored with a single
  # training device - there is no DDP and no NCCL then).
  # On servers whose GPUs sit behind different PCIe switches, NCCL's
  # peer-to-peer transport can STALL rather than fail.
  #
  # Values, from NCCL's NCCL_P2P_LEVEL ("the maximum distance between GPUs
  # where NCCL will use the P2P transport"):
  #
  #   "PIX"  (default) P2P within one PCI switch, and over NVLink; not across
  #          switches. Fixes the hang while keeping the paths that are fast.
  #   "NVL"  P2P only between NVLink-connected GPUs.
  #   "LOC"  never use P2P.
  #   "off"  sets NCCL_P2P_DISABLE=1 instead - miss-alignment's own documented
  #          fix. Blunter: NVIDIA's docs define P2P as direct access "using
  #          NVLink or PCI", so this gives up NVLink too. Use it if "PIX" is
  #          not enough on your machine.
  #   ""     leave NCCL's own defaults completely alone.
  #
  # Correctness is unaffected by any of these - they choose a transport, not
  # an algorithm. Only bandwidth differs.
  nccl_p2p: "PIX"


# -----------------------------------------------------------------------------
#  IsoNet
# -----------------------------------------------------------------------------
isonet:

  # Epochs for the plain noise2noise denoiser (step 'denoise').
  denoise_epochs: 50

  # Epochs for the missing-wedge refinement (step 'refine').
  refine_epochs: 100

  # CTF handling mode passed to denoise/refine. "None" (the exact string
  # IsoNet2's CLI expects) is correct here and should normally stay that
  # way: the half maps IsoNet trains on are already CTF-corrected by
  # WarpTools  IsoNet2's other modes ("network"/"wiener"/
  # "phase_only") each assume RAW, un-CTF-corrected weighted-back-projection
  # input and apply their own CTF-shaped correction on top of it.
  ctf_mode: "None"

  # make_mask
  density_percentage: 50
  std_percentage: 80

  # refine
  mw_weight: 200
  bfactor: 0

  # Fixed tilt range for the missing-wedge model, in degrees, e.g. [-60, 60].
  # NOT RECOMMENDED to fill this in. Empty (default) = tomograms.star gets a
  # per-tomogram range read from each tomogram's own FINAL
  # warp_tiltseries/<tomo>.xml (never an AreTomo-generated file), which
  # reflects exactly the tilts WarpTools used (and, once run_missalignment has
  # run, its in-place refinement too). If set, this ONE range is used for
  # every tomogram instead and left unedited in tomograms.star - only do this
  # if you know it applies to all of them.
  fix_tilt_range: []

  # Trained networks to use. "auto" picks the most recent network_*.pt from
  # the corresponding IsoNet output directory. Set an explicit file name
  # (relative to <processing_directory>/isonet) to pin a specific network.
  denoise_network: "auto"        # e.g. denoise/network_n2n_unet-medium_96_full.pt
  refine_network:  "auto"        # e.g. isonet_maps/network_isonet2-n2n_unet-medium_96_full.pt

  # Appended verbatim to the denoise/refine/predict calls.
  extra_args: ""


# -----------------------------------------------------------------------------
#  RESOLVE quality check   (tomo_denoising quality_check)
# -----------------------------------------------------------------------------
#  Runs RESOLVE in batch mode over a directory of even/odd half maps to
#  estimate a resolution and a signal ratio per tomogram - it needs two
#  genuinely independent reconstructions of the same volume, which both
#  half-map kinds are. Everything RESOLVE writes goes to
#  <processing_directory>/resolve.
#
#  It also produces the results figure, a multi-page PDF with a central Z, Y
#  and X slice of every DENOISED tomogram, sorted best resolution first.
# -----------------------------------------------------------------------------
quality_check:

  # WHICH half maps RESOLVE measures.
  #
  #   true   A dedicated TILT-split reconstruction.
  #   false  FRAME-split half maps.
  enable_tilt_split: true

  # Pixel size in Angstrom the tilt-split reconstructions are made at.
  # Deliberately much coarser than warptools.recon_angpix - tilt-split halves
  # differ from each other far more than frame-split ones.
  tilt_split_target_pixel_size: 50.0 # Should probably be ~50

  # RESOLVE --fast: skips some shells and increases the step size.
  fast: true

  gpu_enabled: true
  cpu_threads: 4

  # Populate the mdocs.train directory automatically from the RESOLVE ranking,
  # but ONLY when it does not exist or holds no .mdoc files.
  # A selection you made yourself is never touched. 
  choose_training_set: true
  min_signal_ratio: 0.35
  outlier_factor: 1.5
