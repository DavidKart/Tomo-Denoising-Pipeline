# =============================================================================
#  tomo_denoising configuration
# =============================================================================
#  Edit this file, then run the pipeline steps in order:
#
#    tomo_denoising create_halfMaps      # frames -> tomograms + even/odd half maps
#    tomo_denoising quality_check        # RESOLVE resolution estimate + report
#    tomo_denoising train_cryoCARE       # cryoCARE training   (mdocs.train set)
#    tomo_denoising predict_cryoCARE     # cryoCARE denoising  (mdocs.predict set)
#    tomo_denoising train_isonet         # IsoNet training     (mdocs.train set)
#    tomo_denoising predict_isonet       # IsoNet denoising    (mdocs.predict set)
#
#  Or run the whole thing in one go:
#
#    tomo_denoising run_pipe --denoiser cryocare
#    tomo_denoising run_pipe --denoiser isonet --skip-quality
#
#  Every step reads this file. Pass a different one with  -c / --config.
#  Every step writes a summary to <processing_directory>/logs/.
# =============================================================================


# -----------------------------------------------------------------------------
#  Resuming
# -----------------------------------------------------------------------------
#  false (default): every step checks what is already finished and only redoes
#                   what is missing or was interrupted. Tilt series that
#                   already have their half maps are skipped, a completed
#                   training is not repeated, and a previously converged tilt
#                   axis is reused instead of being refined again.
#  true:            redo everything from scratch, ignoring previous results.
#
#  Individual steps also accept --force on the command line, which overrides
#  this for that one run.
overwrite: false


# -----------------------------------------------------------------------------
#  Paths
# -----------------------------------------------------------------------------
paths:

  # Directory holding the RAW movie frames (.tif / .tiff / .mrc / .eer) and the
  # gain reference. This directory is only ever READ FROM - nothing is written
  # here. The file names are taken from the SubFramePath entries of the mdocs.
  input_frames: "/path/to/raw/frames"

  # Directory where ALL processing happens and all results are written.
  # Created if it does not exist. Everything below is created inside it:
  #
  #   <processing_directory>/
  #     rec_<tomo>/       <- one self-contained directory per tilt series
  #     raw_halfMaps/     <- every even_/odd_ half map produced
  #     cryocare_config/  <- generated cryoCARE .json configs
  #     cryocare/         <- cryoCARE training data + model
  #     denoised_cryoCARE/
  #     isonet_config/    <- ctffind results + the star files
  #     isonet/           <- IsoNet working directory (networks, masks, output)
  #
  # The mdoc directories are NOT part of this layout - see the 'mdocs'
  # section below; they are separate locations and may live anywhere.
  processing_directory: "/path/to/processing"


# -----------------------------------------------------------------------------
#  Which tomograms are used for which task
# -----------------------------------------------------------------------------
#  These are DIRECTORIES holding .mdoc files. They are independent locations
#  and may live anywhere - they are NOT interpreted relative to
#  processing_directory. An absolute path is used as given; a relative one is
#  resolved against the directory you run tomo_denoising from.
#
#  ALL *.mdoc files found inside are used. The tomogram name is the mdoc file
#  name with the .mdoc (and a trailing .mrc/.st/.tif) stripped, so
#  "TS_01.mrc.mdoc" -> tomogram "TS_01" -> directory "rec_TS_01".
# -----------------------------------------------------------------------------
mdocs:

  # Tilt series to reconstruct in  create_halfMaps.
  preprocessing: "/path/to/mdocs"

  # Tilt series used to TRAIN cryoCARE / IsoNet.
  # A small representative subset (3-5 tomograms) is normally plenty.
  train: "/path/to/mdocsTrain"

  # Tilt series to denoise in  predict_cryoCARE / predict_isonet.
  predict: "/path/to/mdocs"


# -----------------------------------------------------------------------------
#  External programs
# -----------------------------------------------------------------------------
#  Either a bare name (looked up on PATH) or an absolute path to the binary.
#  NOTE: cryoCARE and IsoNet usually live in their own conda environments -
#  activate the right environment before calling the corresponding step, or
#  give the absolute path to the executable inside that environment here.
# -----------------------------------------------------------------------------
executables:
  motioncor:         "MotionCor3"
  aretomo:           "AreTomo2"
  newstack:          "newstack"                      # IMOD
  header:            "header"                        # IMOD, used to read the pixel size
  ctffind:           "ctffind"                       # CTFFIND4, IsoNet defocus estimate
  cryocare_extract:  "cryoCARE_extract_train_data.py"
  cryocare_train:    "cryoCARE_train.py"
  cryocare_predict:  "cryoCARE_predict.py"
  isonet:            "isonet.py"
  resolve:           "RESOLVE"                     # quality_check


# -----------------------------------------------------------------------------
#  GPUs
# -----------------------------------------------------------------------------
#  One list, translated into whatever each program expects
#  (MotionCor3 "-Gpu 0 1", cryoCARE "gpu_id": [0,1], IsoNet "--gpuID 0,1").
gpus: [0, 1]


# -----------------------------------------------------------------------------
#  Data acquisition
# -----------------------------------------------------------------------------
acquisition:

  # Unbinned pixel size of the RAW frames, in Angstrom.
  # "read" -> taken from the mdoc (PixelSpacing), falling back to IMOD 'header'
  #           on the first raw frame. Set a number here if that is wrong.
  pixel_size: "read"

  # Extension of the raw frames: tif, tiff, mrc or eer.
  frame_extension: "tiff"

  # Gain reference. Must be .mrc
  # (convert a .dm4 with:  dm2mrc input_ref.dm4 output_ref.mrc).
  # A path in its own right: absolute is used as given, relative is resolved
  # against the directory you run tomo_denoising from. It is NOT looked up
  # inside paths.input_frames.
  # Leave empty if the frames are already gain corrected.
  gain: ""

  # Constant for the whole dataset. Used by ctffind and written into the
  # IsoNet star file.
  voltage: 300.0                 # kV
  spherical_aberration: 2.7      # mm
  amplitude_contrast: 0.1


# -----------------------------------------------------------------------------
#  MotionCor3
# -----------------------------------------------------------------------------
motioncor:

  # Gain flip. 2 = flip along y. 0 = no flip. See 'MotionCor3 --help'.
  flip_gain: 2

  # Fourier binning of the frames. 1 = no binning.
  # The total binning of the final tomogram is  motioncor.binning * aretomo.binning.
  binning: 2

  iterations: 7
  tolerance: 0.5

  # Only used when acquisition.frame_extension is "eer".
  # fm_int_file is resolved like the gain reference: absolute as given,
  # relative against the directory you run tomo_denoising from.
  # Leave it empty to omit -FmIntFile entirely.
  eer_sampling: 1
  fm_int_file: ""

  # Appended verbatim to every MotionCor3 call.
  extra_args: ""


# -----------------------------------------------------------------------------
#  AreTomo2
# -----------------------------------------------------------------------------
aretomo:

  # Binning applied on top of motioncor.binning.
  binning: 4

  # Reconstruction thickness in BINNED pixels (AreTomo2 -VolZ).
  # Increase for thick lamellae, decrease to save memory/time.
  vol_z: 1200

  # Local (patch) alignment, AreTomo2 syntax. Empty string disables it.
  local_align: "-Patch 4 5"

  # Let AreTomo2 refine the tilt axis rotation (-TiltCor 1 / -TiltCor 0).
  tilt_axis_correction: true

  dark_tolerance: 0.5
  wbp: true                      # weighted back projection (-Wbp 1)
  flip_vol: true                 # -FlipVol 1

  # --- tilt axis refinement -------------------------------------------------
  # The tilt axis is a property of the microscope, not of one tilt series, so
  # it is refined once for the whole dataset and then held fixed - the same
  # idea as WarpTools' tilt axis search.
  #
  # Each iteration aligns a random subset of tilt series, and their tilt axis
  # angles are combined into one robust estimate (see the log). The next
  # iteration passes that estimate to AreTomo2 as -TiltAxis <angle> 0, which
  # makes it refine within +/-3 degrees of it. After the last iteration, ALL
  # tilt series are reconstructed once with -TiltAxis <converged> -1, i.e. the
  # angle fixed and no further refinement.
  #
  # Set to 0 to disable refinement entirely and align every tilt series
  # independently, as before.
  tilt_axis_iterations: 3

  # Tilt series per refinement iteration. Datasets with fewer than this are
  # used in full, and a different random subset is drawn for each iteration.
  tilt_axis_subset_size: 10

  # Seed for those random subsets, so a resumed run picks the same ones.
  tilt_axis_seed: 0

  # Appended verbatim to every AreTomo2 call.
  extra_args: ""


# -----------------------------------------------------------------------------
#  Additional tilt-split half maps
# -----------------------------------------------------------------------------
#  Frame splitting ALWAYS happens: MotionCor3 splits the frames of every tilt
#  into an even and an odd sum (-SplitSum 1), and those reconstructions become
#  <processing_directory>/raw_halfMaps. That is what cryoCARE and IsoNet use.
#
#  Tilt splitting is done IN ADDITION and reuses what the frame-split run
#  already produced - the motion corrected averages and the AreTomo2
#  alignment. Only the stack, the .rawtlt and the .aln are split by tilt
#  number, and AreTomo2 runs once more into its own subdirectory. Nothing is
#  motion corrected or aligned a second time. The result lands in
#  <processing_directory>/raw_halfMaps_tiltSplit and is what quality_check
#  measures with RESOLVE.
# -----------------------------------------------------------------------------
tilt_split:

  enabled: true

  # Pixel size in Angstrom aimed for in the tilt-split reconstructions. They
  # only feed the resolution estimate, so they are reconstructed far more
  # coarsely than the half maps used for denoising. The AreTomo2 binning is
  # derived from this automatically; binning is an integer so the target will
  # not be hit exactly, and the pixel size actually reached is reported.
  target_pixel_size: 50.0


# -----------------------------------------------------------------------------
#  cryoCARE
# -----------------------------------------------------------------------------
#  Written into <processing_directory>/cryocare_config/*.json by
#  train_cryoCARE / predict_cryoCARE. Delete that directory to regenerate.
# -----------------------------------------------------------------------------
cryocare:

  model_name: "denoise_model"

  # --- training data extraction ---
  patch_shape: [72, 72, 72]
  num_slices: 1800
  split: 0.9
  tilt_axis: "Y"
  n_normalization_samples: 500

  # --- network training ---
  epochs: 100
  steps_per_epoch: 200
  batch_size: 16
  unet_kern_size: 3
  unet_n_depth: 3
  unet_n_first: 32
  learning_rate: 0.0004

  # --- prediction ---
  # Increase if prediction runs out of GPU memory, e.g. [16, 16, 16].
  n_tiles: [8, 8, 8]

  # cryoCARE refuses to write into an output directory that already exists
  # unless this is true, which would make every re-run abort - and only after
  # the normalization pass has already finished. Set false to be warned
  # instead of silently regenerating existing training data.
  overwrite: true


# -----------------------------------------------------------------------------
#  IsoNet
# -----------------------------------------------------------------------------
isonet:

  # Epochs for the plain noise2noise denoiser (step 'denoise').
  denoise_epochs: 50

  # Epochs for the missing-wedge refinement (step 'refine').
  refine_epochs: 100

  # CTF handling mode passed to denoise/refine.
  ctf_mode: "network"

  # make_mask
  density_percentage: 50
  std_percentage: 80

  # refine
  mw_weight: 200
  bfactor: 0

  # Tilt range for the missing-wedge model, in degrees.
  # Empty (default) = read per tomogram from rec_<tomo>/<tomo>.rawtlt.
  # prepare_star only accepts ONE range for the whole set, so if the tomograms
  # disagree the WIDEST range is used and the outliers are named in a warning.
  # That direction is deliberate: declaring a range wider than a tomogram
  # really has only leaves it under-corrected, whereas declaring a narrower
  # one makes IsoNet synthesise over data that was actually measured.
  # Set an explicit range to override, e.g.  tilt_range: [-60, 60]
  tilt_range: []

  # Trained networks to use. "auto" picks the most recent network_*.pt from
  # the corresponding IsoNet output directory. Set an explicit file name
  # (relative to <processing_directory>/isonet) to pin a specific network.
  denoise_network: "auto"        # e.g. denoise/network_n2n_unet-medium_96_full.pt
  refine_network:  "auto"        # e.g. isonet_maps/network_isonet2-n2n_unet-medium_96_full.pt

  # Appended verbatim to the denoise/refine/predict calls.
  extra_args: ""


# -----------------------------------------------------------------------------
#  RESOLVE quality check   (tomo_denoising quality_check)
# -----------------------------------------------------------------------------
#  Runs RESOLVE in batch mode over raw_halfMaps_tiltSplit to estimate a
#  resolution and a signal ratio per tomogram. Requires tilt_split.enabled.
#  Everything RESOLVE writes goes to <processing_directory>/resolve.
#
#  It also produces the results figure: a multi-page PDF with a central Z, Y
#  and X slice of every DENOISED tomogram, laid out like 3dmod's XYZ window,
#  captioned with that tomogram's resolution and signal ratio, sorted best
#  resolution first, 9 tomograms per page. It is written to the base
#  processing directory, once per denoiser that has results. The figure is
#  regenerated both when quality_check runs and when a prediction finishes,
#  whichever completes second.
# -----------------------------------------------------------------------------
quality_check:

  # RESOLVE --fast: skips some shells and increases the step size.
  fast: true

  gpu_enabled: true
  cpu_threads: 16

  # Populate the mdocs.train directory automatically from the RESOLVE ranking,
  # but ONLY when it does not exist or holds no .mdoc files. Existing training
  # selections are never touched. The mdocs are symlinked from the
  # mdocs.preprocessing directory.
  #
  #   how many are chosen:  < 10 tomograms -> 3,  >= 10 -> 4,  >= 20 -> 5
  #
  # Tomograms below min_signal_ratio are never eligible. Of those chosen, any
  # whose resolution is worse than outlier_factor times the best one is
  # dropped, even if that leaves only two. If nothing qualifies, the run stops
  # and says so in the log, so you can pick the training tomograms yourself.
  choose_training_set: true
  min_signal_ratio: 0.25
  outlier_factor: 1.5


# -----------------------------------------------------------------------------
#  CTFFIND4  (defocus estimate for IsoNet, run on the first collected tilt)
# -----------------------------------------------------------------------------
#  Run automatically by train_isonet / predict_isonet on the motion-corrected
#  average of the FIRST tilt of each series. Results are cached as
#  <processing_directory>/isonet_config/<tomo>_PS.txt and reused if present.
# -----------------------------------------------------------------------------
ctffind:
  box_size: 512
  min_resolution: 50.0           # Angstrom
  max_resolution: 5.0            # Angstrom
  min_defocus: 5000.0            # Angstrom
  max_defocus: 70000.0           # Angstrom
  defocus_step: 500.0            # Angstrom
